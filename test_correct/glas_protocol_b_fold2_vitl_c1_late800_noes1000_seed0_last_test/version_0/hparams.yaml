_instantiator: lightning.pytorch.cli.instantiate_module
abl_label_smoothing: 0.2
abl_max_clip_dist: 20.0
abl_max_n_ratio: 0.01
abl_schedule: late
abl_start_epoch: 800
active_boundary_loss_enabled: true
active_boundary_loss_weight: 0.1
attn_mask_annealing_enabled: false
attn_mask_annealing_end_steps: null
attn_mask_annealing_start_steps: null
backbone_lr: 1.0e-05
batch_size: 2
check_empty_targets: false
ckpt_path: runs/glas_protocol_b_fold2_vitl_c1_late800_noes1000_seed0/version_0/checkpoints/last.ckpt
dataset_dir: null
decoder_lr: 0.0001
delta_weights: false
ignore_idx: 255
img_size:
- 224
- 224
llrd: 0.8
llrd_l2_enabled: true
load_ckpt_class_head: true
lr: 5.0e-05
lr_mult: 1.0
mask_only_training_enabled: true
metric_threshold: 0.5
network:
  class_path: models.eoseg.EoSegMultiQSegFusion
  init_args:
    decoder_norm: group
    encoder:
      class_path: models.vit.ViT
      init_args:
        backbone_name: vit_large_patch14_reg4_dinov2
        patch_size: 16
    num_q: 2
num_classes: 2
num_workers: 8
persistent_workers: true
pin_memory: true
poly_power: 0.9
source_dir: ../Warwick_QU_Dataset
test_dir: datasets/GlaS_5fold/fold2/Test_Folder
test_split: null
train_dir: datasets/GlaS_5fold/fold2/Train_Folder
train_split: train
val_dir: datasets/GlaS_5fold/fold2/Test_Folder
val_split: val
warmup_steps:
- 500
- 1000
weight_decay: 0.0005
